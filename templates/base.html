<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}HCJ Motors{% endblock %}</title>

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
          rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <!-- CSS -->
    {% if request.endpoint == 'cadastrar_veiculo' %}
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/cadastro.css') }}"
    >
    {% endif %}

</head>

<body>
    <!-- CABEÇALHO HCJ MOTORS -->
    <header class="header">
        <div class="container header-content">

            <!-- Logo com duas versões -->
            <a href="/" class="logo">

                <img
                    class="logo-dark"
                    src="{{ url_for('static', filename='images/logo-hcj-white.png') }}"
                    alt="HCJ Motors"
                >

                <img
                    class="logo-light"
                    src="{{ url_for('static', filename='images/logo-hcj-black.png') }}"
                    alt="HCJ Motors"
                >

                <div class="logo-name">
                    <strong>HCJ</strong>
                    <small>2026</small>
                </div>
            </a>

            <!-- Navegação -->
            <nav class="navbar" aria-label="Menu principal">

                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i>
                    Início
                </a>

                <a href="/catalogo" class="nav-link {% if request.path == '/catalogo' %}active{% endif %}">
                    <i class="fa-solid fa-car-side"></i>
                    Catálogo
                </a>

                <a href="{{ url_for('cadastrar_veiculo') }}"
                class="nav-link {% if request.endpoint == 'cadastrar_veiculo' %}active{% endif %}">
                    <i class="fa-solid fa-circle-plus"></i>
                    Cadastrar Veículo
                </a>

                <a href="/sobre" class="nav-link">
                    Sobre
                </a>

            </nav>

            <!-- Ações -->
            <div class="header-actions">

                <a href="/catalogo" class="icon-button"
                aria-label="Pesquisar veículos">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>

                <button
                    id="theme-toggle"
                    class="icon-button"
                    type="button"
                    aria-label="Alternar tema">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <a href="/login" class="login-button">
                    Entrar
                </a>

            </div>
        </div>
    </header>


    <!-- Conteúdo específico de cada página -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Rodapé compartilhado -->
    <footer class="footer">
        <p>HCJ Motors 2026 — Realizando seus sonhos</p>
    </footer>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
