
{% extends "base.html" %}

{% block title %}
Cadastrar Veículo | HCJ Motors
{% endblock %}

{% block content %}

<section class="cadastro-page">
    <div class="cadastro-container">

        <header class="cadastro-header">
            <h1>Cadastrar Veículo</h1>
            <p>Preencha os dados do veículo para anunciar.</p>
        </header>

        <form class="cadastro-form" action="{{ url_for('cadastrar_veiculo') }}" method="POST" enctype="multipart/form-data" >
            <div class="cadastro-grid">
                <!-- COLUNA ESQUERDA -->
                <div class="cadastro-coluna">
                    <div class="cadastro-campo">
                        <label for="marca">Marca <span>*</span></label>
                        <select id="marca" name="marca" required>
                            <option value="">Selecione a marca</option>
                            <option value="BMW">BMW</option>
                            <option value="Chevrolet">Chevrolet</option>
                            <option value="Fiat">Fiat</option>
                            <option value="Ford">Ford</option>
                            <option value="Honda">Honda</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Volkswagen">Volkswagen</option>
                            <option value="Outra">Outra</option>
                        </select>
                    </div>

                    <div class="cadastro-campo">
                        <label for="modelo">Modelo <span>*</span></label>
                        <input type="text"  id="modelo" name="modelo" placeholder="Digite o modelo" maxlength="80" required >
                    </div>
                    <div class="cadastro-campo">
                        <label for="ano">Ano <span>*</span></label>
                        <input type="number" id="ano" name="ano" min="1900" max="2027" placeholder="Ex.: 2024" required
                        >
                    </div>

                    <div class="cadastro-campo">
                        <label for="preco">Preço (R$) <span>*</span></label>
                        <input type="number"id="preco" name="preco"min="0.01" step="0.01" placeholder="Ex.: 65000,00" required >
                    </div>

                    <div class="cadastro-campo">
                        <label for="quilometragem">
                            Quilometragem <span>*</span>
                        </label>
                        <input type="number" id="quilometragem" name="quilometragem" min="0" placeholder="Ex.: 50000" required >
                    </div>
                </div>

                <!-- COLUNA DIREITA -->
                <div class="cadastro-coluna">
                    <div class="cadastro-campo">
                        <label for="combustivel">
                            Combustível <span>*</span>
                        </label>
                        <select id="combustivel" name="combustivel" required >
                            <option value=""> Selecione o combustível </option>
                            <option value="Gasolina">Gasolina</option>
                            <option value="Etanol">Etanol</option>
                            <option value="Flex">Flex</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Elétrico">Elétrico</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>

                    <div class="cadastro-campo">
                        <label for="transmissao">
                            Câmbio <span>*</span>
                        </label>
                        <select
                            id="transmissao" name="transmissao" required>
                            <option value="">Selecione o câmbio</option>
                            <option value="Manual">Manual</option>
                            <option value="Automático">Automático</option>
                            <option value="CVT">CVT</option>
                            <option value="Automatizado">Automatizado</option>
                        </select>
                    </div>

                    <div class="cadastro-campo">
                        <label for="localizacao">
                            Localização <span>*</span>
                        </label>
                        <input type="text" id="localizacao" name="localizacao" placeholder="Ex.: João Pessoa - PB"  maxlength="120" required >
                    </div>

                    <div class="cadastro-campo">
                        <label for="descricao">
                            Descrição <span>*</span>
                        </label>
                        <textarea id="descricao" name="descricao" placeholder="Fale sobre o veículo..." maxlength="500" rows="6" required>
                        </textarea>
                        <small>Máximo de 500 caracteres.</small>
                    </div>
                </div>
            </div>

            <!-- FOTOS -->
            <div class="cadastro-fotos">
                <label for="fotos" class="cadastro-fotos-titulo">
                    <i class="fa-solid fa-images"></i>
                    Fotos do Veículo
                </label>
                <label for="fotos" class="cadastro-upload">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <strong>Selecione as imagens do veículo</strong>
                    <small>JPG, PNG ou WEBP</small>
                </label>
                <input type="file" id="fotos" name="fotos" accept="image/jpeg,image/png,image/webp" multiple class="cadastro-file-input">
            </div>
            <!-- AÇÕES -->
            <div class="cadastro-acoes">
                <button type="reset" class="cadastro-btn cadastro-btn-limpar">
                    <i class="fa-solid fa-rotate-left"></i>
                    Limpar
                </button>
                <button type="submit" class="cadastro-btn cadastro-btn-enviar" >
                    <i class="fa-solid fa-paper-plane"></i>
                    Cadastrar Veículo
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
